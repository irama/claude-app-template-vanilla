version: 2
updates:
  # "npm" is Dependabot's name for the whole JS ecosystem — it reads pnpm-lock.yaml too.
  # There is no "pnpm" value; do not "fix" this to one.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Group minor/patch updates to reduce PR noise
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
