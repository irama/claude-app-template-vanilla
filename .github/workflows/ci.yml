name: CI

on:
  # No push trigger: the local husky pre-push hook runs typecheck + lint + tests
  # before every push, so re-running them in the cloud on each push just burns
  # metered Actions minutes (private repo). CI stays available on PRs and on demand.
  pull_request:
    branches: [main]
  # Weekly clean-room CI (plan d) — drift/bypass backstop; staggered to avoid fleet contention.
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  quality:
    name: Type check, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Using `npm install` rather than `npm ci` because cross-platform
        # lockfile generation on macOS (arm64) reliably misses some Linux
        # transitive optional deps (e.g. @rolldown/binding-wasm32-wasi's
        # nested @emnapi/* entries). Revisit if switching to pnpm.
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npx eslint src

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # Add any build-time env vars here (use GitHub Secrets for real values)
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}

      - name: Bundle size check
        run: npm run size

      - name: Security audit
        # Blocking on CRITICAL, production dependencies only — fleet policy,
        # 2026-07-26 (status hub docs/fleet-prod-ready-roadmap.md, open item C).
        #
        # Not --audit-level=high: fleet-wide the remaining highs are
        # `fixAvailable: false` build-tooling transitives (brace-expansion →
        # minimatch → glob → … ), so that gate can never go green and only
        # teaches people to ignore CI. Not `continue-on-error` either — that
        # hides a real critical. Highs stay visible via Dependabot on the status
        # hub's CI tile; only the blocking threshold moved.
        #
        # The JSON parse separates "npm's advisory endpoint is broken" (it has
        # 400'd on the retired quick-audit endpoint and returned unparseable
        # gzip through 2026-07) from "this repo has a critical CVE". Only the
        # latter fails the build; a broken endpoint is a loud warning.
        run: |
          set -o pipefail
          if ! npm audit --json --omit=dev > /tmp/audit.json 2>/tmp/audit.err; then
            : # non-zero also means "vulnerabilities found" — the JSON below decides
          fi
          if ! node -e "JSON.parse(require('fs').readFileSync('/tmp/audit.json','utf8'))" 2>/dev/null; then
            echo "::warning::npm audit could not run (registry/advisory endpoint error) — NOT a repo finding:"
            cat /tmp/audit.err || true
            exit 0
          fi
          node -e "
            const a = JSON.parse(require('fs').readFileSync('/tmp/audit.json','utf8'));
            const v = a.metadata.vulnerabilities;
            console.log('prod deps —', JSON.stringify(v));
            if (v.critical > 0) { console.error('::error::' + v.critical + ' CRITICAL vulnerabilities in production dependencies'); process.exit(1); }
          "
